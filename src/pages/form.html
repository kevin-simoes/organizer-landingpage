<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src/assets/imgs/organizer_icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/main.css">
    <title>Organizer - Login</title>
</head>

<body>
    <header>
        <span>
            <img src="/src/assets/imgs/organizer_icon.png" alt="Organizer Icon" />
            <h3>Organizer</h3>
        </span>
        <span>
            <a href="/index.html" class="button-link">Home</a>
        </span>
    </header>
    <div class="form-content">
        <form action="#" method="post">

            <h3>
                Seja bem vindo ao
                <span class="highlight">Organizer</span>
            </h3>

            <p>
                Faça seu registro para saber mais informações sobre o app.
            </p>

            <label for="username">
                Nome e Sobrenome:
            </label>

            <input type="text" id="username" name="username" required>

            <label for="email">
                Seu melhor email:
            </label>

            <input type="email" id="email" name="email" required>

            <label for="profile">
                Você é:
            </label>

            <select id="profile" name="profile" required>
                <option value="" disabled selected>
                    Selecione
                </option>

                <option value="student">
                    Estudante
                </option>

                <option value="teacher">
                    Professor
                </option>

                <option value="worker">
                    Profissional
                </option>

                <option value="worker">
                    Usuário Geral
                </option>
            </select>

            <label for="discovery">
                Como conheceu a Organizer?
            </label>

            <input type="text" id="discovery" name="discovery" placeholder="Instagram, amigos, faculdade..." required>

            <label for="excited">
                O que mais te empolga no aplicativo?
            </label>

            <textarea id="excited" name="excited" rows="4" placeholder="Organização, produtividade, IA..."
                required></textarea>

            <button type="submit">
                Enviar
            </button>

        </form>
    </div>
    <footer>
        @2026 IRIS. Todos os direitos reservados.
    </footer>

</body>

</html>
